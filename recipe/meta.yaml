{% set name = "django-avatar" %}
{% set version = "10.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6088c41f35767ad5907c5c65e13b1e3d0f132b7b9786c3ab98419b64ed7133c9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=65.6.3
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - django >=5.2
    - pillow >=11.2.0
    - django-appconf >=1.2.0
    - dnspython >=2.6.0
    # - Pillow >=10.0.1
    # - Pillow >=10.0.1
    # - Pillow >=10.0.1
    # - Pillow >=11.2.0
    # - Django >=5.2

test:
  imports:
    - avatar
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: A Django app for handling user avatars
  home: https://github.com/jazzband/django-avatar
  license: BSD-3-Clause AND BSD-4-Clause
  license_file:
    - LICENSE.txt
    - avatar/templates/notification/avatar_updated/notice.html
    - avatar/templates/notification/avatar_friend_updated/notice.html

extra:
  recipe-maintainers:
    - rxm7706
    - mxr-conda
